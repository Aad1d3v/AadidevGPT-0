<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#EFE8D7">
<title>Reset password · AadidevGPT-0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233b82f6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:"Inter",sans-serif;
    background:#EFE8D7;
    color:#4A5030;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    -webkit-font-smoothing:antialiased;
}
body::before{
    content:"";
    position:fixed;
    width:700px;height:700px;
    background:radial-gradient(circle,#9CA55E33 0%,transparent 70%);
    top:-250px;right:-250px;
    pointer-events:none;
}
.card{
    width:100%;max-width:420px;
    background:#F8F3E6;
    border:1px solid #A3A96B;
    border-radius:20px;
    padding:40px 36px 32px;
    position:relative;
    box-shadow:0 24px 60px rgba(86,98,47,.18);
    animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px;}
.circle{width:18px;height:18px;border-radius:50%;background:#3b82f6;box-shadow:0 0 12px #3b82f6,0 0 22px #3b82f6;}
.brand-name{font-family:"Fraunces",serif;font-weight:600;font-size:21px;}
h1{font-family:"Fraunces",serif;font-size:24px;font-weight:600;text-align:center;margin-bottom:8px;}
.sub{text-align:center;color:#7D8563;font-size:14px;line-height:1.6;margin-bottom:24px;}
label{display:block;font-size:13px;font-weight:500;color:#7D8563;margin:0 0 6px 2px;}
input{
    width:100%;display:block;margin-bottom:16px;
    font-size:16px;padding:14px 16px;border-radius:12px;
    border:1px solid #A3A96B;background:#EAE2CE;color:#4A5030;outline:none;
}
input:focus{border-color:#6B773E;box-shadow:0 0 10px rgba(107,119,62,.25);}
button{
    width:100%;border:none;background:#6B773E;color:#F8F3E6;
    padding:14px;border-radius:14px;font-weight:600;cursor:pointer;
    font-size:15px;font-family:inherit;transition:.25s;
}
button:hover{background:#56622F;}
button:disabled{opacity:.5;cursor:not-allowed;}
.msg{color:#dc2626;font-size:13px;min-height:18px;margin-bottom:8px;text-align:center;}
.msg.ok{color:#4ade80;}
.foot{text-align:center;color:#8A9268;font-size:12px;margin-top:24px;}
.foot a{color:#6B773E;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
    <div class="brand">
        <div class="circle"></div>
        <div class="brand-name">AadidevGPT-0</div>
    </div>

    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your account.</p>

    <form onsubmit="resetPassword(event)">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password" required minlength="6">

        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" required minlength="6">

        <div class="msg" id="msg"></div>

        <button type="submit" id="submitBtn">Update password</button>
    </form>

    <p class="foot">Powered by model 04Aadi · <a href="/">Back to AadidevGPT-0</a></p>
</div>

<script>
var TOKEN = {{ token | tojson }};

async function resetPassword(event) {
    event.preventDefault();
    var nw = document.getElementById("newPassword").value;
    var confirm = document.getElementById("confirmPassword").value;
    var msg = document.getElementById("msg");
    var btn = document.getElementById("submitBtn");

    if (nw.length < 6) {
        msg.textContent = "Password must be at least 6 characters.";
        return;
    }
    if (nw !== confirm) {
        msg.textContent = "Passwords don't match.";
        return;
    }

    btn.disabled = true;
    btn.textContent = "Please wait...";
    msg.textContent = "";

    try {
        var res = await fetch("/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN, new_password: nw })
        });
        var data = await res.json();
        if (res.ok) {
            msg.className = "msg ok";
            msg.textContent = "Password updated! Redirecting to sign in...";
            setTimeout(function () { window.location.href = "/"; }, 1400);
        } else {
            msg.className = "msg";
            msg.textContent = data.error || "Could not reset password.";
            btn.disabled = false;
            btn.textContent = "Update password";
        }
    } catch (e) {
        msg.textContent = "Could not reach the server. Please try again.";
        btn.disabled = false;
        btn.textContent = "Update password";
    }
}
</script>
</body>
</html>
