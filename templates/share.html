<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Shared chat — AadidevGPT-0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#EFE8D7;color:#4A5030;min-height:100vh;-webkit-font-smoothing:antialiased;}
    .wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px;}
    .top{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid #A3A96B;margin-bottom:24px;}
    .dot{width:12px;height:12px;border-radius:50%;background:#3b82f6;box-shadow:0 0 12px #3b82f6,0 0 22px #3b82f6;flex:none;}
    .brand{font-family:"Fraunces",serif;font-weight:600;font-size:18px;color:#4A5030;}
    .brand span{color:#7D8563;font-weight:500;font-size:13px;font-family:"Inter",sans-serif;}
    .title{font-family:"Fraunces",serif;font-size:21px;font-weight:600;color:#4A5030;margin-bottom:4px;word-break:break-word;}
    .date{color:#8A9268;font-size:13px;margin-bottom:28px;}
    .msg{padding:14px 18px;border-radius:16px;line-height:1.7;margin-bottom:16px;word-wrap:break-word;}
    .user{background:linear-gradient(135deg,#6B773E,#56622F);color:#F8F3E6;border-bottom-right-radius:6px;}
    .bot{background:#F8F3E6;border:1px solid #A3A96B;border-bottom-left-radius:6px;}
    .who{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.75;margin-bottom:6px;}
    .msg pre{background:#0d1117;border:1px solid #A3A96B;border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0;font-size:13px;}
    .msg code{background:#0d1117;border:1px solid #A3A96B;padding:2px 6px;border-radius:6px;font-size:13px;font-family:ui-monospace,Menlo,monospace;}
    .msg a{color:#6B773E;}
    .err{text-align:center;padding:60px 20px;color:#7D8563;}
    .err h1{color:#4A5030;margin-bottom:10px;font-size:22px;font-family:"Fraunces",serif;font-weight:600;}
    .home{display:inline-block;margin-top:18px;color:#6B773E;text-decoration:none;border:1px solid #A3A96B;background:#F8F3E6;padding:10px 18px;border-radius:10px;}
    .foot{text-align:center;color:#8A9268;font-size:12px;margin-top:40px;}
</style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <div class="dot"></div>
        <div class="brand">AadidevGPT-0 <span>/ shared chat</span></div>
    </div>

    {% if error %}
        <div class="err">
            <h1>😕 {{ error }}</h1>
            <a class="home" href="/">Open AadidevGPT-0</a>
        </div>
    {% else %}
        <h1 class="title">{{ title }}</h1>
        <div class="date">{{ created_at }}</div>

        {% for m in messages %}
            <div class="msg {{ 'user' if m.role == 'user' else 'bot' }}">
                <div class="who">{{ 'You' if m.role == 'user' else 'AadidevGPT-0' }}</div>
                <div class="body">{{ m.content }}</div>
            </div>
        {% endfor %}

        <div class="foot">Shared from AadidevGPT-0 · powered by model 04Aadi</div>
    {% endif %}
</div>
</body>
</html>
